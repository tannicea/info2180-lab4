<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avengers Character Search</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>AVENGERS DATABASE</h1>
        
        <div class="search-box">
            <label for="search">Search by Name or Alias</label>
            <div class="input-wrapper">
                <input type="text" id="search" placeholder="e.g. Captain America or Steve Rogers">
                <button id="search-btn">SEARCH</button>
            </div>
        </div>
        
        <h2>DOSSIER RESULT</h2>
        <hr>
        <div id="result"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
